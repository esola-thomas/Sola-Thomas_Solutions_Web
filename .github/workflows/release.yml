name: Create Release

# Push a version tag on main to publish a GitHub Release with generated notes:
#   git tag -a v1.2.0 -m "..." && git push origin v1.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "solathomas.com $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
